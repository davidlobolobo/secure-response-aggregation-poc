name: Enhancement proposal
description: Suggest an improvement to the PoC or the protocol
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change and why. If it touches the cryptographic protocol, note which security property it improves or affects.
    validations:
      required: true
