name: Bug report
description: Something in the PoC doesn't behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, don't use this template — follow the process in [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, output you got, Java/Maven version.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Affected commit or version
    validations:
      required: false
